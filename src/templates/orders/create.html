{% extends "base_nav.html" %}

{% block title %}Herenciapp - New Order Ticket{% endblock %}

{% block content %}
<div class="space-y-6 max-w-7xl mx-auto px-2 sm:px-4">
    
    <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 border-b border-gray-200 pb-4">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-gray-900">Abrir comanda</h1>
            <p class="text-xs text-gray-500 mt-1">
                Agrega los datos necesarios para enviarla a la cocina
            </p>
        </div>
        <a href="/main" class="w-full md:w-auto bg-slate-800 hover:bg-slate-700 text-white px-4 py-2.5 
            rounded-lg text-sm font-medium transition flex items-center justify-center space-x-2 shadow-sm">
            <i class="fa-solid fa-arrow-left"></i> <span>Regresar al tablero principal</span>
        </a>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
        
        <div class="lg:col-span-1 space-y-6 lg:sticky lg:top-6">
            <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
                <h2 class="text-base font-bold text-gray-800 mb-4 flex items-center">
                    <i class="fa-solid fa-clipboard-list text-amber-500 mr-2"></i> Llena los campos
                </h2>
                
                <div class="space-y-4">
                    <div>
                        <label for="table_no" class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5">mesa #:</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400 pointer-events-none">
                                <i class="fa-solid fa-chair"></i>
                            </span>
                            <input 
                                type="number" 
                                id="table_no" 
                                name="table_no" 
                                min="1" 
                                required placeholder="e.g. 4"
                                class="w-full bg-gray-50 border border-gray-300 rounded-lg pl-10 pr-4 py-2.5 text-gray-900 font-medium focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 transition text-sm">
                        </div>
                    </div>

                    <div>
                        <label for="number_of_persons" class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5"># de comensales:</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400 pointer-events-none">
                                <i class="fa-solid fa-users"></i>
                            </span>
                            <input 
                                type="number" 
                                id="number_of_persons" 
                                name="number_of_persons" 
                                min="1" 
                                max="20" 
                                value="1" 
                                required
                                class="w-full bg-gray-50 border border-gray-300 rounded-lg pl-10 pr-4 py-2.5 text-gray-900 font-medium focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 transition text-sm"
                                onchange="regenerateSeatSections()">
                        </div>
                    </div>
                </div>

                <div class="mt-6 pt-4 border-t border-gray-200 space-y-2.5">
                    <button type="button" onclick="submitCompleteTicket(event)"
                            class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 px-4 rounded-xl shadow-sm transition flex items-center justify-center space-x-2 text-sm">
                        <i class="fa-solid fa-paper-plane"></i> 
                        <span>Enviar comanda a cocina</span>
                    </button>
                    <button type="button" onclick="resetWorkspace()"
                            class="w-full bg-gray-100 hover:bg-gray-200 text-gray-500 hover:text-gray-700 text-xs font-medium py-2 rounded-lg transition">
                        Limpiar los campos
                    </button>
                </div>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-6">
            <div id="seats-workspace-root" class="space-y-6">
                <p>seat section</p>
                </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    console.log("🔥🔥🔥 ORDER TICKET SCRIPT LOADED 🔥🔥🔥");
    
    // Maps live databases elements into browser execution arrays
    const PRODUCT_CATALOG = [
        {% for p in products %}
        { 
            id: {{ p.id | default(0) }}, 
            name: {{ (p.main_dish if p.main_dish else p.name) | default('') | tojson }}, 
            price: {{ p.price | default(0.0) }}, 
            category: {{ (p.category if p.category else '') | tojson }},
            photo: {{ (p.photo if p.photo else '') | tojson }} 
        },
        {% endfor %}
    ];

    const FLAVOR_CATALOG = [
        {% for f in flavors %}
        { 
            id: {{ f.id | default(0) }}, 
            product_id: {{ f.product_id | default(0) }}, 
            description: {{ f.description | default('') | tojson }} 
        },
        {% endfor %}
    ];

    const MEAT_CATALOG = [
        {% for m in meat_catalogue %}
        { 
            id: {{ m.id | default(0) }}, 
            description: {{ m.description | default('') | tojson }} 
        },
        {% endfor %}
    ];

    // Debug print your constants safely
    console.log("📦 PRODUCT_CATALOG loaded:", PRODUCT_CATALOG);
    console.log("🎨 FLAVOR_CATALOG loaded:", FLAVOR_CATALOG);
    console.log("🥩 MEAT_CATALOG loaded:", MEAT_CATALOG);

    const ORDER_WORKSPACE = {};

    let activeSeatNumber = 1;
    
    /**
     * Generate a person's space
     */
    function initializePerson(seatNumber) {
        console.log("🔥 initializePerson() CALLED");
        if (!ORDER_WORKSPACE[seatNumber]) {
            ORDER_WORKSPACE[seatNumber] = {
                items: []
            };
        }
    }
    
    /**
     * Rebuilds container card blocks reflecting guest counts designated by the waiter
     */
    
    function regenerateSeatSections() {
    console.log("🔥 regenerateSeatSections() CALLED");
    const workspaceRoot =
        document.getElementById('seats-workspace-root');

    const totalPersons =
        parseInt(
            document.getElementById('number_of_persons').value
        ) || 1;

    if (!workspaceRoot) {
        return;
    }

    // Make sure the active person still exists
    if (activeSeatNumber > totalPersons) {
        activeSeatNumber = totalPersons;
    }

    // Initialize all persons
    for (let seatNum = 1; seatNum <= totalPersons; seatNum++) {
        initializePerson(seatNum);
    }

    workspaceRoot.innerHTML = `
        <div id="person-navigation"></div>

        <div id="active-person-workspace" class="mt-4"></div>
    `;

    renderPersonNavigation(totalPersons);
    renderActivePersonWorkspace();
}

    function renderPersonNavigation(totalPersons) {

    const container =
        document.getElementById('person-navigation');

    if (!container) {
        return;
    }

    let html = `
        <div
            class="
                bg-white
                border border-gray-200
                rounded-xl
                shadow-sm
                p-2
            "
        >

            <div class="flex items-center gap-2">

                <button
                    type="button"
                    onclick="navigatePerson(-1)"
                    class="
                        flex-shrink-0
                        w-10 h-10
                        rounded-lg
                        border border-gray-200
                        bg-gray-50
                        text-gray-500
                        hover:bg-gray-100
                        hover:text-gray-700
                        transition
                    "
                >
                    <i class="fa-solid fa-chevron-left"></i>
                </button>

                <div
                    id="person-tabs"
                    class="
                        flex-1
                        flex
                        gap-2
                        overflow-x-auto
                        scrollbar-hide
                        py-1
                    "
                >
    `;

    for (let seatNum = 1; seatNum <= totalPersons; seatNum++) {

        initializePerson(seatNum);

        const isActive =
            seatNum === activeSeatNumber;

        const itemCount =
            ORDER_WORKSPACE[seatNum].items.reduce(
                (total, item) => total + item.quantity,
                0
            );

        html += `
            <button
                type="button"
                onclick="switchPerson(${seatNum})"
                class="
                    flex-shrink-0
                    min-w-[72px]
                    px-3 py-2
                    rounded-lg
                    border
                    transition-all
                    duration-150
                    ${
                        isActive
                        ? `
                            bg-amber-500
                            border-amber-500
                            text-slate-950
                            shadow-sm
                          `
                        : `
                            bg-white
                            border-gray-200
                            text-gray-600
                            hover:border-amber-300
                            hover:bg-amber-50
                          `
                    }
                "
            >

                <div class="text-sm font-bold">
                    ${seatNum}
                </div>

                <div
                    class="
                        text-[10px]
                        mt-0.5
                        ${
                            isActive
                            ? 'text-slate-800'
                            : 'text-gray-400'
                        }
                    "
                >
                    ${
                        itemCount > 0
                        ? `${itemCount} ${itemCount === 1 ? 'item' : 'items'}`
                        : 'Sin items'
                    }
                </div>

            </button>
        `;
    }

    html += `
                </div>

                <button
                    type="button"
                    onclick="navigatePerson(1)"
                    class="
                        flex-shrink-0
                        w-10 h-10
                        rounded-lg
                        border border-gray-200
                        bg-gray-50
                        text-gray-500
                        hover:bg-gray-100
                        hover:text-gray-700
                        transition
                    "
                >
                    <i class="fa-solid fa-chevron-right"></i>
                </button>

            </div>
        </div>
    `;

    container.innerHTML = html;

    // Keep active person visible
    const activeTab =
        document.querySelector(
            `#person-tabs button:nth-child(${activeSeatNumber})`
        );

    if (activeTab) {
        activeTab.scrollIntoView({
            behavior: 'smooth',
            block: 'nearest',
            inline: 'center'
        });
    }
}

    function navigatePerson(direction) {

    const totalPersons =
        parseInt(
            document.getElementById('number_of_persons').value
        ) || 1;

    const newSeat =
        activeSeatNumber + direction;

    if (newSeat < 1 || newSeat > totalPersons) {
        return;
    }

    switchPerson(newSeat);
}

    function switchPerson(seatNumber) {

    const totalPersons =
        parseInt(
            document.getElementById('number_of_persons').value
        ) || 1;

    if (
        seatNumber < 1 ||
        seatNumber > totalPersons
    ) {
        return;
    }

    initializePerson(seatNumber);

    activeSeatNumber = seatNumber;

    renderPersonNavigation(totalPersons);
    renderActivePersonWorkspace();
}

    function renderActivePersonWorkspace() {

    const workspace =
        document.getElementById('active-person-workspace');

    if (!workspace) {
        return;
    }

    const seatNumber = activeSeatNumber;

    initializePerson(seatNumber);

    const person =
        ORDER_WORKSPACE[seatNumber];

    workspace.innerHTML = `
        <div
            class="
                bg-white
                border border-gray-200
                rounded-xl
                shadow-sm
                overflow-hidden
            "
        >

            <div
                class="
                    bg-slate-50
                    border-b border-gray-200
                    px-4 py-3
                "
            >

                <div class="flex items-center justify-between">

                    <div class="flex items-center gap-3">

                        <span
                            class="
                                flex items-center justify-center
                                w-9 h-9
                                bg-amber-100
                                text-amber-800
                                rounded-lg
                                text-sm
                                font-bold
                                border border-amber-200
                            "
                        >
                            ${seatNumber}
                        </span>

                        <div>

                            <div
                                class="
                                    text-xs
                                    uppercase
                                    tracking-wider
                                    text-gray-400
                                    font-bold
                                "
                            >
                                Orden actual
                            </div>

                            <div
                                class="
                                    text-lg
                                    font-bold
                                    text-gray-800
                                "
                            >
                                Persona #${seatNumber}
                            </div>

                        </div>

                    </div>

                    <div
                        class="
                            text-xs
                            text-gray-400
                            font-semibold
                        "
                    >
                        ${person.items.length}
                        ${person.items.length === 1 ? 'platillo' : 'platillos'}
                    </div>

                </div>

            </div>

            <div class="p-4">

                <div
                    id="product-mosaic-${seatNumber}"
                    class="
                        grid
                        grid-cols-2
                        sm:grid-cols-3
                        lg:grid-cols-4
                        xl:grid-cols-5
                        gap-3
                    "
                >
                </div>

            </div>

        </div>
    `;

    renderPersonItems(seatNumber);
}

    function renderProductMosaic(seatNumber) {

    const container =
        document.getElementById(`product-mosaic-${seatNumber}`);

    if (!container) {
        return;
    }

    PRODUCT_CATALOG.forEach(product => {

        const card = document.createElement('button');

        card.type = 'button';

        card.className = `
            group
            bg-white
            border border-gray-200
            rounded-xl
            overflow-hidden
            text-left
            shadow-sm
            hover:shadow-md
            hover:border-amber-400
            hover:-translate-y-0.5
            active:scale-[0.98]
            transition-all
            duration-150
            focus:outline-none
            focus:ring-2
            focus:ring-amber-500/30
        `;

        const imageHtml = product.photo
            ? `
                <img
                    src="/media/${product.photo}"
                    alt="${product.name}"
                    class="w-full aspect-square object-cover
                           group-hover:scale-105 transition-transform
                           duration-200"
                >
              `
            : `
                <div
                    class="w-full aspect-square bg-gray-100
                           flex items-center justify-center
                           text-gray-300">
                    <i class="fa-solid fa-image text-3xl"></i>
                </div>
              `;

        card.innerHTML = `
            ${imageHtml}

            <div class="p-2.5">
                <div class="font-semibold text-gray-800 text-xs
                            leading-tight">
                    ${product.name}
                </div>

                <div class="text-amber-600 font-bold text-xs mt-1">
                    $${Number(product.price).toFixed(2)}
                </div>
            </div>
        `;

        card.addEventListener('click', () => {
            handleProductSelected(seatNumber, product.id);
        });

        container.appendChild(card);
    });
}

    /**
     * The new UI handled a selected product
     */

    function handleProductSelected(seatNumber, productId) {

    const product = PRODUCT_CATALOG.find(
        p => p.id === productId
    );

    if (!product) {
        return;
    }

    showItemConfigurator(seatNumber, product);
}

    function showItemConfigurator(seatNumber, product) {
        const container = document.getElementById(`product-mosaic-${seatNumber}`);
        if (!container) return;

        // Fetch direct flavors tied to this product
        const flavors = FLAVOR_CATALOG.filter(f => f.product_id === product.id);

        let flavorOptions = '';

        // Check if any flavor for this dish is designated as "carne"
        const isMeatProduct = flavors.some(
            f => f.description && f.description.toLowerCase() === 'carne'
        );

        if (isMeatProduct) {
            // Find the baseline "carne" flavor entity to retain its foreign key reference
            const carneFlavor = flavors.find(
                f => f.description && f.description.toLowerCase() === 'carne'
            );
            const baseFlavorId = carneFlavor ? carneFlavor.id : 0;

            flavorOptions = `<option value="">-- Selecciona el tipo de carne --</option>`;

            // Populate choices dynamically using MEAT_CATALOG
            MEAT_CATALOG.forEach(meat => {
                flavorOptions += `
                    <option value="${baseFlavorId}" data-selection-text="${meat.description}">
                        ${meat.description}
                    </option>
                `;
            });
        } else if (flavors.length === 0) {
            // Dishes with no specific option configured
            flavorOptions = `
                <option value="0" data-selection-text="Estándar">
                    Standard / Sin opciones
                </option>
            `;
        } else {
            // Standard specific flavors (e.g., Sodas: Coca, Fanta, Sprite)
            flavorOptions = `<option value="">-- Selecciona una opción --</option>`;
            
            flavors.forEach(flavor => {
                flavorOptions += `
                    <option value="${flavor.id}" data-selection-text="${flavor.description}">
                        ${flavor.description}
                    </option>
                `;
            });
        }

        container.innerHTML = `
            <div class="col-span-full bg-white border border-gray-200 rounded-xl p-4 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-3">
                        ${
                            product.photo
                            ? `<img src="/media/${product.photo}" alt="${product.name}" class="w-16 h-16 rounded-xl object-cover border border-gray-200">`
                            : ''
                        }
                        <div>
                            <div class="text-xs uppercase tracking-wider text-gray-400 font-bold">
                                Platillo seleccionado
                            </div>
                            <div class="text-lg font-bold text-gray-800">
                                ${product.name}
                            </div>
                            <div class="text-sm font-semibold text-amber-600">
                                $${Number(product.price).toFixed(2)}
                            </div>
                        </div>
                    </div>

                    <button type="button" onclick="showProductMosaic(${seatNumber})"
                        class="text-gray-400 hover:text-gray-700 px-2 py-1 rounded-lg hover:bg-gray-100 transition">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5">
                            Sabor / Opción
                        </label>
                        <select id="config-flavor-${seatNumber}"
                            class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20">
                            ${flavorOptions}
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5">
                            Cantidad
                        </label>
                        <div class="flex items-center">
                            <button type="button" onclick="changeConfiguredQuantity(${seatNumber}, -1)"
                                class="w-11 h-11 bg-gray-100 hover:bg-gray-200 rounded-l-lg font-bold text-lg">
                                −
                            </button>
                            <input id="config-quantity-${seatNumber}" type="number" min="1" value="1"
                                class="w-16 h-11 text-center border-y border-gray-300 text-sm font-bold focus:outline-none">
                            <button type="button" onclick="changeConfiguredQuantity(${seatNumber}, 1)"
                                class="w-11 h-11 bg-gray-100 hover:bg-gray-200 rounded-r-lg font-bold text-lg">
                                +
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5">
                            Notas adicionales
                        </label>
                        <input id="config-notes-${seatNumber}" type="text" placeholder="Ejemplo: sin cebolla, bien dorado"
                            class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20">
                    </div>

                    <button type="button" onclick="addConfiguredItem(${seatNumber}, ${product.id})"
                        class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 px-4 rounded-xl transition shadow-sm">
                        <i class="fa-solid fa-plus mr-1"></i>
                        Agregar platillo
                    </button>
                </div>
            </div>
        `;
    }

    function changeConfiguredQuantity(seatNumber, delta) {

    const input =
        document.getElementById(`config-quantity-${seatNumber}`);

    if (!input) {
        return;
    }

    const current =
        parseInt(input.value) || 1;

    input.value = Math.max(1, current + delta);
}

    function addConfiguredItem(seatNumber, productId) {

    const product = PRODUCT_CATALOG.find(
        p => p.id === productId
    );

    if (!product) {
        return;
    }

    const flavorSelect =
        document.getElementById(`config-flavor-${seatNumber}`);

    const quantityInput =
        document.getElementById(`config-quantity-${seatNumber}`);

    const notesInput =
        document.getElementById(`config-notes-${seatNumber}`);

    const quantity =
        parseInt(quantityInput.value) || 1;

    const selectedOption =
        flavorSelect.options[flavorSelect.selectedIndex];

    const flavorId =
        selectedOption ? parseInt(selectedOption.value) : null;

    const selection =
        selectedOption
            ? selectedOption.text.trim()
            : "Standard";

    if (!flavorSelect.value) {
        alert("Selecciona una opción para el platillo.");
        flavorSelect.focus();
        return;
    }

    ORDER_WORKSPACE[seatNumber].items.push({
        product_id: product.id,
        product_name: product.name,
        price: Number(product.price),
        flavor_id: flavorId || null,
        selection: selection,
        quantity: quantity,
        notes: notesInput.value.trim(),
        extra_charge: 0
    });

    console.log(
        `Person ${seatNumber} workspace:`,
        ORDER_WORKSPACE[seatNumber]
    );

    renderPersonItems(seatNumber);
}

    function renderPersonItems(seatNumber) {

    const container =
        document.getElementById(`product-mosaic-${seatNumber}`);

    if (!container) {
        return;
    }

    const person =
        ORDER_WORKSPACE[seatNumber];

    let html = '';

    if (person.items.length > 0) {

        html += `
            <div class="col-span-full space-y-2 mb-4">

                <div class="text-xs uppercase tracking-wider
                            text-gray-400 font-bold mb-2">
                    Platillos agregados
                </div>
        `;

        person.items.forEach((item, index) => {

            html += `
                <div
                    class="flex items-center justify-between
                           bg-gray-50 border border-gray-200
                           rounded-xl p-3">

                    <div>
                        <div class="font-bold text-gray-800 text-sm">
                            ${item.product_name}
                        </div>

                        <div class="text-xs text-gray-500 mt-0.5">
                            ${item.selection}
                            · Cant. ${item.quantity}
                        </div>

                        ${
                            item.notes
                            ? `
                                <div class="text-xs text-gray-400 mt-1">
                                    ${item.notes}
                                </div>
                              `
                            : ''
                        }
                    </div>

                    <button
                        type="button"
                        onclick="removeWorkspaceItem(${seatNumber}, ${index})"
                        class="text-gray-400 hover:text-rose-500
                               p-2 rounded-lg hover:bg-rose-50">
                        <i class="fa-solid fa-xmark"></i>
                    </button>

                </div>
            `;
        });

        html += `</div>`;
    }

    html += `
        <div class="col-span-full">

            <button
                type="button"
                onclick="showProductMosaic(${seatNumber})"
                class="w-full border-2 border-dashed
                       border-gray-300 hover:border-amber-400
                       text-gray-500 hover:text-amber-600
                       rounded-xl py-5 transition font-semibold">

                <i class="fa-solid fa-plus mr-1"></i>
                Agregar otro platillo

            </button>

        </div>
    `;

    container.innerHTML = html;

    const totalPersons =
    parseInt(
        document.getElementById('number_of_persons').value
    ) || 1;

renderPersonNavigation(totalPersons);
}

    function showProductMosaic(seatNumber) {

    const container =
        document.getElementById(`product-mosaic-${seatNumber}`);

    if (!container) {
        return;
    }

    container.innerHTML = '';

    renderProductMosaic(seatNumber);
}

    /**
     * Convert our data into a valid payload
     */

    function buildOrderItemsPayload() {

    const items = [];

    Object.entries(ORDER_WORKSPACE).forEach(
        ([seatNumber, person]) => {

            person.items.forEach(item => {

                items.push({
                    person_number: parseInt(seatNumber),
                    product_id: item.product_id,
                    flavor_id: item.flavor_id,
                    selection: item.selection,
                    quantity: item.quantity,
                    notes: item.notes || "",
                    extra_charge: item.extra_charge || 0
                });

            });

        }
    );

    return items;
}

    /**
     * validate the order before sending to backend
     */

     function validateOrderWorkspace() {

    const items = buildOrderItemsPayload();

    if (items.length === 0) {
        alert(
            "Selecciona al menos un platillo antes de enviar la orden."
        );
        return false;
    }

    for (const item of items) {

        if (!item.product_id || item.product_id <= 0) {
            alert("Hay un platillo inválido en la orden.");
            return false;
        }

        if (!item.quantity || item.quantity < 1) {
            alert(
                `Cantidad inválida para el producto ${item.product_id}.`
            );
            return false;
        }

        /*
         * If the backend requires a concrete selection,
         * don't allow an empty selection.
         */
        if (
            !item.selection ||
            item.selection.trim() === ""
        ) {
            alert(
                `Falta seleccionar una opción para el producto ${item.product_id}.`
            );
            return false;
        }
    }

    return true;
}

    /**
     * Loops over active rows and submits payload to backend REST endpoints
     */
    async function submitCompleteTicket(event) {

    if (event) {
        event.preventDefault();
    }

    const tableNoInput =
        document.getElementById('table_no');

    const tableNo =
        parseInt(tableNoInput.value);

    const totalPersons =
        parseInt(
            document.getElementById('number_of_persons').value
        ) || 1;

    if (!tableNo) {
        alert(
            "Por favor asigna un número válido de mesa."
        );

        tableNoInput.focus();

        return;
    }

    if (!validateOrderWorkspace()) {
        return;
    }

    const items =
        buildOrderItemsPayload();

    const orderPayload = {
        table_no: tableNo,
        number_of_persons: totalPersons,
        items: []
    };

    console.log(
        "Submitting ORDER_WORKSPACE:",
        ORDER_WORKSPACE
    );

    console.log(
        "Generated order items:",
        items
    );

    try {

        /*
         * Step 1
         * Create the base ticket
         */
        const orderResponse =
            await fetch("/orders/create", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(orderPayload)
            });

        if (!orderResponse.ok) {

            const errorData =
                await orderResponse.json();

            throw new Error(
                errorData.detail ||
                "Failed initializing base ticket state."
            );
        }

        const createdOrder =
            await orderResponse.json();

        const orderId =
            createdOrder.id;

        /*
         * Step 2
         * Allocate every workspace item
         */
        for (const item of items) {

            const itemResponse =
                await fetch(
                    `/orders/${orderId}/items`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify(item)
                    }
                );

            if (!itemResponse.ok) {

                let errorMessage =
                    "Error processing order item.";

                try {
                    const errorData =
                        await itemResponse.json();

                    errorMessage =
                        errorData.detail ||
                        errorMessage;

                } catch (_) {
                    // Keep generic message
                }

                throw new Error(errorMessage);
            }
        }

        alert(
            `¡Comanda enviada a la cocina con éxito para la Mesa ${tableNo}!`
        );

        window.location.href = "/main";

    } catch (err) {

        console.error(
            "Ticket processing error:",
            err
        );

        alert(
            `Error procesando la comanda: ${err.message}`
        );
    }
}

    regenerateSeatSections();
});
